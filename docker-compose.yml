services:
  bot:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      # Container-local paths override anything set in .env.
      DATABASE_PATH: /app/data/bot.sqlite3
      ODOO_WORKSPACE: /workspace/odoo
    volumes:
      # The Odoo source is mounted read-only so the operating system enforces
      # the read-only invariant even if the tool allowlist is ever misconfigured.
      - ${ODOO_SOURCE:-./odoo}:/workspace/odoo:ro
      # Claude CLI credentials and session transcripts. Forks resume from here,
      # so this must survive container restarts.
      - claude-home:/home/node/.claude
      # SQLite message/session mappings.
      - bot-data:/app/data
    # The bot needs no inbound ports and no elevated capabilities.
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

volumes:
  claude-home:
  bot-data:
